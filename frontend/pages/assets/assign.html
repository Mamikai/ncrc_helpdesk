<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCRC Help Desk - Assign Asset</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-content">
        <div class="page-inner narrow">

            <div class="topbar">
                <div class="page-title">
                    <h2>Assign Asset</h2>
                    <div class="subtitle"><a href="inventory.html">← Back to inventory</a></div>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell" id="notificationBell">🔔<span class="notification-badge" id="notificationBadge" style="display:none;">0</span>
                        <div class="notification-dropdown" id="notificationDropdown"></div>
                    </div>
                    <div class="user-menu">
                        <div class="user-menu-info">
                            <div class="user-menu-name" id="userMenuName">—</div>
                            <div class="user-menu-role" id="userMenuRole">—</div>
                        </div>
                        <div class="user-avatar" id="userMenuAvatar">—</div>
                        <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <form id="assignForm">
                    <div class="form-group">
                        <label class="form-label" for="assetSelect">Asset (in-store only)</label>
                        <select class="form-control" id="assetSelect"><!-- TODO: dynamic data from backend - assets-module.js populateAssetDropdown() --></select>
                        <div class="form-error" id="assetError">Please select an asset to assign.</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="assignToStaff">Assign To (Staff Name)</label>
                        <input type="text" id="assignToStaff" class="form-control" placeholder="e.g. Jane Mwangi">
                        <div class="form-hint">Doesn't need to match a Help Desk login — this can be anyone, including pool or shared items.</div>
                        <div class="form-error" id="staffError">Please enter who this is being assigned to.</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="assignNotes">Notes (optional)</label>
                        <textarea id="assignNotes" class="form-control" placeholder="Condition on handover, accessories included, etc."></textarea>
                    </div>

                    <button type="button" class="btn btn-primary" id="assignSubmitBtn">Assign Asset</button>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script src="../../assets/js/assets-module.js"></script>
<script>
(async function () {
    const session = await initAuthenticatedPage();
    if (!session) return;
    initAssignForm();
})();
</script>
</body>
</html>
