<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCRC Help Desk - Asset Inventory</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-content">
        <div class="page-inner">

            <div class="topbar">
                <div class="page-title">
                    <h2>Asset Inventory</h2>
                    <div class="subtitle">Laptops, desktops, network gear, and other registered equipment</div>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell" id="notificationBell">🔔<span class="notification-badge" id="notificationBadge" style="display:none;">0</span>
                        <div class="notification-dropdown" id="notificationDropdown"></div>
                    </div>
                    <div class="user-menu">
                        <div class="user-menu-info">
                            <div class="user-menu-name" id="userMenuName">—</div>
                            <div class="user-menu-role" id="userMenuRole">—</div>
                        </div>
                        <div class="user-avatar" id="userMenuAvatar">—</div>
                        <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
                    </div>
                </div>
            </div>

            <div class="quick-actions" id="ictActions" style="display:none;">
                <a href="assign.html" class="btn btn-gold">Assign Asset</a>
            </div>

            <!-- Admin-only: register a brand-new asset -->
            <div class="card" id="addAssetCard" style="display:none;">
                <div class="card-header"><h3 class="card-title">Register New Asset</h3></div>
                <form id="addAssetForm">
                    <div class="grid-2" style="margin-bottom: 0;">
                        <div>
                            <div class="form-group">
                                <label class="form-label" for="newAssetTag">Asset Tag *</label>
                                <input type="text" id="newAssetTag" class="form-control" placeholder="e.g. NCRC-AST-010">
                                <div class="form-error" id="assetTagError">Please enter an asset tag.</div>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="newAssetCategory">Category</label>
                                <select id="newAssetCategory" class="form-control">
                                    <option value="desktop">Desktop</option>
                                    <option value="laptop" selected>Laptop</option>
                                    <option value="ups">UPS</option>
                                    <option value="printer">Printer</option>
                                    <option value="network_device">Network Device</option>
                                    <option value="tv">TV</option>
                                    <option value="air_conditioner">Air Conditioner</option>
                                    <option value="software_license">Software License</option>
                                    <option value="ip_phone">IP Phone</option>
                                    <option value="tablet">Tablet</option>
                                    <option value="boardroom_accessory">Boardroom Accessory</option>
                                    <option value="cctv_camera">CCTV Camera</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="newAssetDepartment">Department</label>
                                <select id="newAssetDepartment" class="form-control"></select>
                            </div>
                        </div>
                        <div>
                            <div class="form-group">
                                <label class="form-label" for="newAssetModel">Model</label>
                                <input type="text" id="newAssetModel" class="form-control" placeholder="e.g. Dell Latitude 5420">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="newAssetSerial">Serial Number</label>
                                <input type="text" id="newAssetSerial" class="form-control" placeholder="e.g. SN-00123">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="newAssetStatus">Initial Status</label>
                                <select id="newAssetStatus" class="form-control">
                                    <option value="in_store" selected>In Store</option>
                                    <option value="working">Working (already in use)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary" id="addAssetBtn">Register Asset</button>
                </form>
            </div>

            <div class="card">
                <div class="card-header"><h3 class="card-title">Registered Assets</h3></div>
                <div class="inventory-toolbar">
                    <div class="inventory-filter-label">🔍 Filter</div>
                    <input type="search" id="assetSearchInput" class="form-control" placeholder="Search tag, name, serial..." aria-label="Search assets">
                    <select id="assetCategoryFilter" class="form-control" aria-label="Filter by category">
                        <option value="">All Categories</option>
                        <option value="desktop">Desktop</option><option value="laptop">Laptop</option>
                        <option value="ups">UPS</option><option value="printer">Printer</option>
                        <option value="network_device">Network Device</option><option value="tv">TV</option><option value="air_conditioner">Air Conditioner</option>
                        <option value="software_license">Software License</option><option value="ip_phone">IP Phone</option><option value="tablet">Tablet</option>
                        <option value="boardroom_accessory">Boardroom Accessory</option><option value="cctv_camera">CCTV Camera</option><option value="other">Other</option>
                    </select>
                    <select id="assetStatusFilter" class="form-control" aria-label="Filter by status">
                        <option value="">All Status</option>
                    </select>
                    <button type="button" class="btn btn-outline" id="exportAssetsBtn">Export CSV</button>
                    <span class="inventory-count" id="assetCount"></span>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead id="assetTableHead"></thead>
                        <tbody id="assetInventoryBody"><!-- TODO: dynamic data from backend - assets-module.js loadAssetInventory() --></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Edit asset modal (ICT/Admin) -->
<div class="modal-overlay" id="editAssetModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Edit Asset — <span id="editAssetTag"></span></div>
            <button class="modal-close" id="closeEditModalBtn">&times;</button>
        </div>
        <input type="hidden" id="editAssetId">
        <div class="form-group">
            <label class="form-label" for="editAssetStatus">Status</label>
            <select id="editAssetStatus" class="form-control">
            </select>
        </div>
        <div class="form-group">
            <label class="form-label" for="editAssetDepartment">Department</label>
            <select id="editAssetDepartment" class="form-control"></select>
        </div>
        <div class="form-group">
            <label class="form-label" for="editAssetNotes">Notes</label>
            <textarea id="editAssetNotes" class="form-control"></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="document.getElementById('editAssetModal').style.display='none'">Cancel</button>
            <button class="btn btn-primary" id="saveAssetEditBtn">Save Changes</button>
        </div>
    </div>
</div>

<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script src="../../assets/js/assets-module.js"></script>
<script>
(async function () {
    const session = await initAuthenticatedPage();
    if (!session) return;

    // Defense in depth: the sidebar already hides this link from
    // non-qualifying staff, and assets/list.php rejects them for
    // real — this is just a friendly message if they land here anyway.
    const ASSET_VISIBLE_DEPARTMENTS = ['Internal Audit and Risk Assurance', 'Supply Chain Management'];
    const allowed = session.role === 'ict' || session.role === 'admin' ||
        (session.role === 'user' && ASSET_VISIBLE_DEPARTMENTS.includes(session.department));
    if (!allowed) {
        document.querySelector('.page-inner').innerHTML = '<div class="card"><div class="empty-state"><div class="empty-icon">🔒</div><div class="empty-title">You do not have access to the asset inventory</div></div></div>';
        return;
    }

    const editable = session.role === 'ict' || session.role === 'admin';
    const head = document.getElementById('assetTableHead');
    head.innerHTML = '<tr><th>Asset Tag</th><th>Category</th><th>Department</th><th>Model</th><th>Status</th><th>Assigned To</th>' +
        (editable ? '<th></th>' : '') + '</tr>';

    if (session.role === 'ict') document.getElementById('ictActions').style.display = 'flex';
    if (session.role === 'admin') {
        document.getElementById('ictActions').style.display = 'flex';
        document.getElementById('addAssetCard').style.display = 'block';
        populateDepartmentSelect('newAssetDepartment', 'Select Department');
        initAddAssetForm();
    }

    loadAssetInventory('assetInventoryBody', editable);
    if (editable) {
        populateAssetStatusSelect('editAssetStatus');
        populateDepartmentSelect('editAssetDepartment', 'Select Department');
        initAssetEditModal();
    }
})();
</script>
</body>
</html>
