<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCRC Help Desk - Asset Movement</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-content">
        <div class="page-inner">
            <div class="topbar">
                <div class="page-title">
                    <h2>Asset Movement</h2>
                    <div class="subtitle">Assignment history for registered assets</div>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell" id="notificationBell">🔔<span class="notification-badge" id="notificationBadge" style="display:none;">0</span><div class="notification-dropdown" id="notificationDropdown"></div></div>
                    <div class="user-menu">
                        <div class="user-menu-info"><div class="user-menu-name" id="userMenuName">—</div><div class="user-menu-role" id="userMenuRole">—</div></div>
                        <div class="user-avatar" id="userMenuAvatar">—</div>
                        <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="inventory-toolbar">
                    <div class="inventory-filter-label">🔍 Filter</div>
                    <input type="search" id="movementSearch" class="form-control" placeholder="Search asset, person, notes..." aria-label="Search movement history">
                    <input type="search" id="movementAssetTag" class="form-control" placeholder="Asset tag" aria-label="Filter by asset tag">
                    <button type="button" class="btn btn-outline" id="exportMovementBtn">Export CSV</button>
                    <span class="inventory-count" id="movementCount"></span>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead><tr><th>Asset Tag</th><th>Category</th><th>Model</th><th>Assigned To</th><th>Moved By</th><th>Notes</th><th>Moved At</th></tr></thead>
                        <tbody id="assetMovementBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script src="../../assets/js/asset-movement.js"></script>
<script>
(async function () {
    const session = await initAuthenticatedPage();
    if (!session) return;
    if (session.role !== 'ict' && session.role !== 'admin') {
        document.querySelector('.page-inner').innerHTML = '<div class="card"><div class="empty-state"><div class="empty-title">You do not have access to asset movement history</div></div></div>';
        return;
    }
    initAssetMovementPage();
})();
</script>
</body>
</html>
