<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCRC Help Desk - Register Asset</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-content">
        <div class="page-inner narrow">
            <div class="topbar">
                <div class="page-title">
                    <h2>Register New Asset</h2>
                    <div class="subtitle"><a href="inventory.html">Back to asset inventory</a></div>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell" id="notificationBell">🔔<span class="notification-badge" id="notificationBadge" style="display:none;">0</span><div class="notification-dropdown" id="notificationDropdown"></div></div>
                    <div class="user-menu">
                        <div class="user-menu-info"><div class="user-menu-name" id="userMenuName">—</div><div class="user-menu-role" id="userMenuRole">—</div></div>
                        <div class="user-avatar" id="userMenuAvatar">—</div>
                        <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <form id="addAssetForm">
                    <div class="grid-2">
                        <div>
                            <div class="form-group"><label class="form-label" for="newAssetTag">Asset Tag *</label><input type="text" id="newAssetTag" class="form-control" placeholder="e.g. NCRC-AST-010"><div class="form-error" id="assetTagError">Please enter an asset tag.</div></div>
                            <div class="form-group"><label class="form-label" for="newAssetCategory">Category</label><select id="newAssetCategory" class="form-control"><option value="desktop">Desktop</option><option value="laptop" selected>Laptop</option><option value="ups">UPS</option><option value="printer">Printer</option><option value="network_device">Network Device</option><option value="tv">TV</option><option value="air_conditioner">Air Conditioner</option><option value="software_license">Software License</option><option value="ip_phone">IP Phone</option><option value="tablet">Tablet</option><option value="boardroom_accessory">Boardroom Accessory</option><option value="cctv_camera">CCTV Camera</option><option value="other">Other</option></select></div>
                            <div class="form-group"><label class="form-label" for="newAssetDepartment">Department</label><select id="newAssetDepartment" class="form-control"></select></div>
                        </div>
                        <div>
                            <div class="form-group"><label class="form-label" for="newAssetModel">Model</label><input type="text" id="newAssetModel" class="form-control" placeholder="e.g. Dell Latitude 5420"></div>
                            <div class="form-group"><label class="form-label" for="newAssetSerial">Serial Number</label><input type="text" id="newAssetSerial" class="form-control" placeholder="e.g. SN-00123"></div>
                            <div class="form-group"><label class="form-label" for="newAssetStatus">Initial Status</label><select id="newAssetStatus" class="form-control"></select></div>
                        </div>
                    </div>
                    <div class="modal-actions" style="justify-content:flex-start;"><a href="inventory.html" class="btn btn-outline">Cancel</a><button type="button" class="btn btn-primary" id="addAssetBtn">Register Asset</button></div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script src="../../assets/js/assets-module.js"></script>
<script>
(async function () {
    const session = await initAuthenticatedPage();
    if (!session) return;
    if (session.role !== 'admin') {
        document.querySelector('.page-inner').innerHTML = '<div class="card"><div class="empty-state"><div class="empty-title">You do not have access to register assets</div></div></div>';
        return;
    }
    populateDepartmentSelect('newAssetDepartment', 'Select Department');
    populateAssetStatusSelect('newAssetStatus');
    document.getElementById('newAssetStatus').value = 'in_store';
    initAddAssetForm();
})();
</script>
</body>
</html>
