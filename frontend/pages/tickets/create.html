<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCRC Help Desk - Submit a Ticket</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-content">
        <div class="page-inner narrow">

            <div class="topbar">
                <div class="page-title">
                    <h2>Submit a Ticket</h2>
                    <div class="subtitle">Describe the issue and our ICT team will get to it</div>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell" id="notificationBell">🔔<span class="notification-badge" id="notificationBadge" style="display:none;">0</span>
                        <div class="notification-dropdown" id="notificationDropdown"></div>
                    </div>
                    <div class="user-menu">
                        <div class="user-menu-info">
                            <div class="user-menu-name" id="userMenuName">—</div>
                            <div class="user-menu-role" id="userMenuRole">—</div>
                        </div>
                        <div class="user-avatar" id="userMenuAvatar">—</div>
                        <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <form id="ticketCreateForm">

                    <div class="form-group">
                        <label class="form-label" for="ticketTitle">Ticket Title *</label>
                        <select id="ticketTitle" class="form-control">
                            <option value="">Select request type</option>
                            <option>ICT Preventive Maintenance</option>
                            <option>ICT Helpdesk Service</option>
                            <option>ICT Equipment Specification</option>
                            <option>Network Restoration</option>
                            <option>Creation of New User Accounts</option>
                            <option>Corporate Email Account Creation</option>
                            <option>Password Reset</option>
                            <option>Escalation of Faulty Equipment</option>
                            <option>ICT Equipment Provision</option>
                            <option>Website/Intranet Update</option>
                            <option>ICT Security Breach</option>
                            <option>Virtual Meeting Hosting</option>
                            <option value="other">Other ICT Request</option>
                        </select>
                        <input type="text" id="otherTicketTitle" class="form-control" placeholder="Please specify the request" style="display:none; margin-top: var(--spacing-sm);">
                        <div class="form-hint">Brief summary of the issue</div>
                        <div class="form-error" id="titleError">Please enter a ticket title.</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="ticketDepartment">Assigned Department</label>
                        <select id="ticketDepartment" class="form-control">
                            <!-- Populated by populateDepartmentSelect() in ui.js - never hand-typed -->
                        </select>
                        <div class="form-hint">This department is assigned to your account by an administrator.</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="ticketDescription">Description *</label>
                        <textarea id="ticketDescription" class="form-control"
                                  placeholder="Describe what's happening, when it started, and anything you've already tried."></textarea>
                        <div class="form-error" id="descriptionError">Please describe the issue.</div>
                    </div>

                    <div class="modal-actions" style="justify-content: flex-start;">
                        <a href="lists.html" class="btn btn-outline">Cancel</a>
                        <button type="button" class="btn btn-danger" id="clearFormBtn">Clear</button>
                        <button type="button" class="btn btn-primary" id="submitTicketBtn">Submit</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script src="../../assets/js/tickets.js"></script>
<script>
(async function () {
    const session = await initAuthenticatedPage();
    if (!session) return;
    initTicketCreateForm(session);
})();
</script>
</body>
</html>
