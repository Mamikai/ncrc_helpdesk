<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCRC Help Desk - Submit a Ticket</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-content">
        <div class="page-inner narrow">

            <div class="topbar">
                <div class="page-title">
                    <h2>Submit a Ticket</h2>
                    <div class="subtitle">Describe the issue and our ICT team will get to it</div>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell" id="notificationBell">🔔<span class="notification-badge" id="notificationBadge" style="display:none;">0</span>
                        <div class="notification-dropdown" id="notificationDropdown"></div>
                    </div>
                    <div class="user-menu">
                        <div class="user-menu-info">
                            <div class="user-menu-name" id="userMenuName">—</div>
                            <div class="user-menu-role" id="userMenuRole">—</div>
                        </div>
                        <div class="user-avatar" id="userMenuAvatar">—</div>
                        <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <form id="ticketCreateForm">

                    <div class="form-group">
                        <label class="form-label" for="ticketTitle">Ticket Title *</label>
                        <input type="text" id="ticketTitle" class="form-control" placeholder="Enter ticket title">
                        <div class="form-hint">Brief summary of the issue</div>
                        <div class="form-error" id="titleError">Please enter a ticket title.</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="ticketDepartment">Department *</label>
                        <select id="ticketDepartment" class="form-control">
                            <option value="">Select Department</option>
                            <option value="ICT">ICT</option>
                            <option value="Research">Research</option>
                            <option value="Finance and Accounts">Finance and Accounts</option>
                            <option value="Human Resource & Administration">Human Resource &amp; Administration</option>
                            <option value="Corporate Communications">Corporate Communications</option>
                            <option value="Supply Chain Management">Supply Chain Management</option>
                            <option value="Internal Audit">Internal Audit</option>
                            <option value="Legal Services">Legal Services</option>
                            <option value="Director/CEO Office">Director/CEO Office</option>
                            <option value="Other">Other</option>
                        </select>
                        <div class="form-error" id="departmentError">Please select a department.</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="ticketPriority">Priority</label>
                        <select id="ticketPriority" class="form-control">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="ticketDescription">Description</label>
                        <textarea id="ticketDescription" class="form-control"
                                  placeholder="Describe what's happening, when it started, and anything you've already tried."></textarea>
                    </div>

                    <div class="modal-actions" style="justify-content: flex-start;">
                        <a href="lists.html" class="btn btn-outline">Cancel</a>
                        <button type="button" class="btn btn-danger" id="clearFormBtn">Clear</button>
                        <button type="button" class="btn btn-primary" id="submitTicketBtn">Submit</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script src="../../assets/js/tickets.js"></script>
<script>
(async function () {
    const session = await initAuthenticatedPage();
    if (!session) return;
    initTicketCreateForm();
})();
</script>
</body>
</html>
