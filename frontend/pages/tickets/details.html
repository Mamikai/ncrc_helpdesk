<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCRC Help Desk - Ticket Detail</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-content">
        <div class="page-inner medium">

            <div class="topbar">
                <div class="page-title">
                    <h2>Ticket <span id="detailTicketNumber">—</span></h2>
                    <div class="subtitle"><a href="lists.html">← Back to tickets</a></div>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell" id="notificationBell">🔔<span class="notification-badge" id="notificationBadge" style="display:none;">0</span>
                        <div class="notification-dropdown" id="notificationDropdown"></div>
                    </div>
                    <div class="user-menu">
                        <div class="user-menu-info">
                            <div class="user-menu-name" id="userMenuName">—</div>
                            <div class="user-menu-role" id="userMenuRole">—</div>
                        </div>
                        <div class="user-avatar" id="userMenuAvatar">—</div>
                        <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h3 class="card-title" id="detailTitle">—</h3></div>
                <p style="margin-bottom: var(--spacing-lg); color: var(--color-text);" id="detailDescription">—</p>

                <div class="grid-2" style="margin-bottom: 0;">
                    <div>
                        <div class="form-group"><label class="form-label">Reported By</label><div id="detailReportedBy">—</div></div>
                        <div class="form-group"><label class="form-label">Department</label><div id="detailDepartment">—</div></div>
                        <div class="form-group"><label class="form-label">Created</label><div id="detailCreated">—</div></div>
                        <div class="form-group"><label class="form-label">Resolved</label><div id="detailResolved">—</div></div>
                    </div>
                    <div>
                        <div class="form-group"><label class="form-label">Assigned To</label><div id="detailAssignedTo">—</div></div>
                        <div class="form-group"><label class="form-label">Priority</label><div id="detailPriority">—</div></div>
                        <div class="form-group"><label class="form-label">Status</label><div id="detailStatus">—</div></div>
                        <div class="form-group"><label class="form-label">Closed</label><div id="detailClosed">—</div></div>
                    </div>
                </div>
            </div>

            <!-- ICT-only: claim an unclaimed ticket -->
            <div class="card" id="claimSection" style="display:none;">
                <div class="card-header"><h3 class="card-title">Claim This Ticket</h3></div>
                <p style="margin-bottom: var(--spacing-md); color: var(--color-text-light);">Nobody is handling this yet — take it on to start working it.</p>
                <button class="btn btn-primary" id="claimTicketBtn">Take This Ticket</button>
            </div>

            <!-- Admin-only: assign an unclaimed ticket to a specific ICT officer -->
            <div class="card" id="assignSection" style="display:none;">
                <div class="card-header"><h3 class="card-title">Assign To ICT Officer</h3></div>
                <div class="form-group">
                    <label class="form-label" for="assignToIctSelect">ICT Officer</label>
                    <select class="form-control" id="assignToIctSelect" style="max-width: 320px;"></select>
                </div>
                <button class="btn btn-primary" id="assignTicketBtn">Assign Ticket</button>
            </div>

            <!-- ICT/Admin only: update ticket status -->
            <div class="card" id="statusSection" style="display:none;">
                <div class="card-header"><h3 class="card-title">Update Status</h3></div>
                <div class="form-group">
                    <label class="form-label" for="statusSelect">Status</label>
                    <select class="form-control" id="statusSelect" style="max-width: 260px;">
                        <option value="open">Open</option>
                        <option value="inprogress">In Progress</option>
                        <option value="resolved">Resolved</option>
                        <option value="closed">Closed</option>
                    </select>
                </div>
                <div class="form-group" id="resolutionNotesGroup" style="display:none;">
                    <label class="form-label" for="resolutionNotesInput">How was this resolved? *</label>
                    <textarea class="form-control" id="resolutionNotesInput"
                              placeholder="What was the cause, and what fixed it? This becomes a searchable knowledge base entry for other ICT officers."></textarea>
                    <div class="form-hint">Required when marking Resolved or Closed.</div>
                    <div class="form-error" id="resolutionNotesError">Please describe how this was resolved before closing.</div>
                </div>
                <button class="btn btn-primary" id="updateStatusBtn">Update Status</button>
            </div>

            <div class="card">
                <div class="card-header"><h3 class="card-title">Comments</h3></div>
                <div id="commentsThread"><!-- TODO: dynamic data from backend - tickets.js loadComments() --></div>
                <div class="form-group" style="margin-top: var(--spacing-md);">
                    <textarea class="form-control" id="newComment" placeholder="Add a comment or ask for more info..."></textarea>
                </div>
                <label class="checkbox-row" style="margin-bottom: var(--spacing-md);">
                    <input type="checkbox" id="internalCommentCheckbox"> Internal note (hidden from the person who reported this ticket)
                </label>
                <button class="btn btn-secondary btn-sm" id="addCommentBtn">Add Comment</button>
            </div>

        </div>
    </div>
</div>

<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script src="../../assets/js/tickets.js"></script>
<script>
(async function () {
    const session = await initAuthenticatedPage();
    if (!session) return;

    const params = new URLSearchParams(window.location.search);
    const ticketId = params.get('id') || '1';

    const ticket = await loadTicketDetail(ticketId);
    if (!ticket) return;

    initTicketActions(session, ticket, ticketId);

    const canMarkInternal = session.role === 'ict' || session.role === 'admin';
    loadComments(ticketId, canMarkInternal);
    initAddComment(ticketId, canMarkInternal);
})();
</script>
</body>
</html>
