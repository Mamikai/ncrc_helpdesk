<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCRC Help Desk - Manage Users</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-content">
        <div class="page-inner">

            <div class="topbar">
                <div class="page-title">
                    <h2>Manage Users</h2>
                    <div class="subtitle">All Help Desk accounts — deactivate access or update department</div>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell" id="notificationBell">🔔<span class="notification-badge" id="notificationBadge" style="display:none;">0</span>
                        <div class="notification-dropdown" id="notificationDropdown"></div>
                    </div>
                    <div class="user-menu">
                        <div class="user-menu-info">
                            <div class="user-menu-name" id="userMenuName">—</div>
                            <div class="user-menu-role" id="userMenuRole">—</div>
                        </div>
                        <div class="user-avatar" id="userMenuAvatar">—</div>
                        <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
                    </div>
                </div>
            </div>

            <div class="quick-actions">
                <a href="add-user.html" class="btn btn-primary">+ Add User</a>
            </div>

            <div class="card">
                <div class="card-header"><h3 class="card-title">All Accounts</h3></div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Status</th><th>Last Login</th><th></th></tr></thead>
                        <tbody id="usersTableBody"><!-- TODO: dynamic data from backend - users.js loadUsersList() --></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script src="../../assets/js/users.js"></script>
<script>
(async function () {
    const session = await initAuthenticatedPage();
    if (!session) return;
    loadUsersList('usersTableBody', session.user_id);
})();
</script>
</body>
</html>
