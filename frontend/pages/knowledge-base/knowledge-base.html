<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCRC Help Desk - Knowledge Base</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-content">
        <div class="page-inner medium">

            <div class="topbar">
                <div class="page-title">
                    <h2>Knowledge Base</h2>
                    <div class="subtitle">How past tickets were resolved — built automatically from resolution notes</div>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell" id="notificationBell">🔔<span class="notification-badge" id="notificationBadge" style="display:none;">0</span>
                        <div class="notification-dropdown" id="notificationDropdown"></div>
                    </div>
                    <div class="user-menu">
                        <div class="user-menu-info">
                            <div class="user-menu-name" id="userMenuName">—</div>
                            <div class="user-menu-role" id="userMenuRole">—</div>
                        </div>
                        <div class="user-avatar" id="userMenuAvatar">—</div>
                        <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label" for="kbSearchInput">Search</label>
                    <input type="text" id="kbSearchInput" class="form-control" placeholder="e.g. printer, VPN, password reset...">
                </div>
            </div>

            <div id="kbList"><!-- TODO: dynamic data from backend - knowledge-base.js loadKnowledgeBase() --></div>

        </div>
    </div>
</div>

<script src="../../assets/js/ui.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/session.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script src="../../assets/js/knowledge-base.js"></script>
<script>
(async function () {
    const session = await initAuthenticatedPage();
    if (!session) return;

    if (session.role !== 'ict' && session.role !== 'admin') {
        document.querySelector('.page-inner').innerHTML = '<div class="card"><div class="empty-state"><div class="empty-icon">🔒</div><div class="empty-title">You do not have access to this page</div></div></div>';
        return;
    }

    loadKnowledgeBase('kbList');
    initKnowledgeBaseSearch('kbList');
})();
</script>
</body>
</html>
