<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCRC Help Desk</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: var(--spacing-md); }
        .router-logo { width: 80px; height: 80px; border-radius: 50%; }
        .router-text { color: var(--color-text-light); font-size: 0.9rem; }
    </style>
</head>
<body>
    <img src="assets/images/ncrc-logo.png" alt="NCRC logo" class="router-logo">
    <div class="router-text">Loading NCRC Help Desk...</div>

    <script src="assets/js/ui.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/session.js"></script>
    <script>
        (async function () {
            const session = await getCurrentSession();
            const dashboardMap = {
                admin: getRelativePath('pages/dashboard/admin.html'),
                ict: getRelativePath('pages/dashboard/ict.html'),
                user: getRelativePath('pages/dashboard/user.html')
            };
            setTimeout(function () {
                if (session && dashboardMap[session.role]) {
                    window.location.href = dashboardMap[session.role];
                } else {
                    window.location.href = getRelativePath('pages/auth/login.html');
                }
            }, 300);
        })();
    </script>
</body>
</html>
